<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MART Drive</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --bg-main: #f8f9fa;
      --bg-surface: #ffffff;
      --text-main: #202124;
      --text-muted: #5f6368;
      --primary: #0b57d0;
      --primary-light: #e8f0fe;
      --border: #e0e0e0;
      --danger: #d93025;
      --hover-bg: #f1f3f4;
      --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', 'Roboto', sans-serif; }

    body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Navbar */
    .navbar {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
      z-index: 100;
    }

    .nav-left { display: flex; align-items: center; gap: 16px; width: 250px; }
    .logo { font-size: 22px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .logo-icon { color: #fbbc04; font-size: 28px; }

    /* Search Bar */
    .nav-center { flex: 1; max-width: 720px; }
    .search-box {
      background-color: var(--bg-main);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 48px;
      transition: background-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus-within { background-color: var(--bg-surface); box-shadow: var(--shadow-md); }
    .search-box input {
      border: none; background: transparent; outline: none;
      width: 100%; font-size: 16px; padding: 0 16px; color: var(--text-main);
    }

    .nav-right { display: flex; align-items: center; gap: 12px; padding-left: 16px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); }

    /* Layout */
    .app-body { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 250px; padding: 16px 12px; background-color: var(--bg-surface); overflow-y: auto; }
    .sidebar-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-radius: 20px;
      cursor: pointer; font-size: 14px; font-weight: 500;
      color: var(--text-main); margin-bottom: 4px;
      transition: background-color 0.2s;
    }
    .sidebar-item:hover { background-color: var(--hover-bg); }
    .sidebar-item.active { background-color: var(--primary-light); color: var(--primary); }

    /* Main Content */
    .main-content { flex: 1; display: flex; flex-direction: column; padding: 16px 24px; overflow-y: auto; }
    
    /* Upload Area */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      background-color: var(--bg-surface);
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .upload-area.dragover { border-color: var(--primary); background-color: var(--primary-light); }
    .upload-area p { color: var(--text-muted); font-size: 14px; margin-bottom: 12px; }

    /* File Grid */
    .files-header { margin-bottom: 16px; font-size: 16px; font-weight: 500; color: var(--text-main); }
    .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding-bottom: 24px; }
    
    .file-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .file-card:hover { background-color: #f8faff; box-shadow: var(--shadow-md); }
    
    .file-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .file-icon { font-size: 24px; }
    .file-name { font-size: 14px; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .file-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
    
    .file-actions { display: flex; gap: 8px; margin-top: auto; opacity: 0; transition: opacity 0.2s; }
    .file-card:hover .file-actions { opacity: 1; }

    /* Buttons */
    .btn {
      padding: 8px 24px; border-radius: 4px; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; transition: background-color 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background-color: var(--primary); color: white; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background-color: #0b4b9e; }
    .btn-icon { padding: 8px; border-radius: 50%; background: transparent; color: var(--text-muted); }
    .btn-icon:hover { background-color: var(--hover-bg); color: var(--text-main); }
    .btn-danger-icon:hover { background-color: #fce8e6; color: var(--danger); }

    /* Login Screen */
    .login-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: var(--bg-main); }
    .login-card { background: var(--bg-surface); padding: 48px 40px; border-radius: 28px; text-align: center; max-width: 450px; width: 100%; box-shadow: var(--shadow-md); }
    .login-card h1 { font-size: 28px; font-weight: 400; margin-bottom: 12px; }
    .login-card p { color: var(--text-muted); margin-bottom: 32px; font-size: 15px; line-height: 1.5; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 24px;
      background: #323232; color: white; padding: 12px 24px; border-radius: 4px;
      font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000;
      box-shadow: var(--shadow-md);
    }
    .toast.show { opacity: 1; }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .nav-left { width: auto; }
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-wrapper">
    <div class="login-card">
      <div class="logo" style="justify-content: center; margin-bottom: 24px;">
        <span class="logo-icon material-symbols-outlined">folder</span> 
        <span style="color: var(--text-main); font-weight: 700;">MART Drive</span>
      </div>
      <h1>Welcome</h1>
      <p>Store, share, and collaborate on files seamlessly with your Google Drive.</p>
      <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="signIn()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- Main App -->
  <div id="appScreen" class="hidden" style="height: 100vh; display: flex; flex-direction: column;">
    
    <nav class="navbar">
      <div class="nav-left">
        <div class="logo"><span class="logo-icon material-symbols-outlined">folder</span> MART Drive</div>
      </div>
      <div class="nav-center">
        <div class="search-box">
          <span class="material-symbols-outlined" style="color: var(--text-muted);">search</span>
          <input type="text" id="searchInput" placeholder="Search in MART Drive" onkeyup="filterFiles()">
        </div>
      </div>
      <div class="nav-right">
        <img id="userAvatar" class="user-avatar" src="" alt="User" style="display:none;">
        <button class="btn btn-icon material-symbols-outlined" onclick="logout()" title="Sign out">logout</button>
      </div>
    </nav>

    <div class="app-body">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-item active">
          <span class="material-symbols-outlined">folder</span> My Drive
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        
        <!-- Upload Area -->
        <div class="upload-area" id="dropZone">
          <p>Drag and drop files here to upload</p>
          <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
            <span class="material-symbols-outlined" style="font-size: 20px;">add</span> New Upload
          </button>
          <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
        </div>

        <div class="files-header">Recent Files</div>
        
        <div id="loadingSkeleton" class="files-grid">
          <!-- Skeletons for loading state -->
          <div class="file-card" style="height: 140px; opacity: 0.5;"></div>
          <div class="file-card" style="height: 140px; opacity: 0.5;"></div>
          <div class="file-card" style="height: 140px; opacity: 0.5;"></div>
        </div>

        <div id="filesList" class="files-grid hidden">
          <!-- Files will be populated here -->
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Status message</div>

  <!-- Firebase Modules -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, addDoc, query, where, getDocs, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDUcT6hVqLHy3pYzwg1oktI7amTpF9Qj4c",
      authDomain: "mart-drive.firebaseapp.com",
      projectId: "mart-drive",
      storageBucket: "mart-drive.firebasestorage.app",
      messagingSenderId: "829348083361",
      appId: "1:829348083361:web:d6e91ccec70c2b9d53e2e0",
      measurementId: "G-J2ERB07TW0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let accessToken = null;
    let allFiles = []; // Store files for local search filtering

    // UI Helper: Toast
    window.showToast = (msg) => {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    };

    window.signIn = async () => {
      const provider = new GoogleAuthProvider();
      provider.addScope('https://www.googleapis.com/auth/drive.file');
      provider.setCustomParameters({ prompt: 'consent' });

      try {
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        accessToken = credential.accessToken;
      } catch (err) {
        showToast('Sign in error: ' + err.message);
      }
    };

    window.logout = async () => {
      await signOut(auth);
      accessToken = null;
      currentUser = null;
      window.location.reload(); // Quick reset
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        
        if (!accessToken) {
          try {
            const provider = new GoogleAuthProvider();
            provider.addScope('https://www.googleapis.com/auth/drive.file');
            const result = await signInWithPopup(auth, provider);
            accessToken = GoogleAuthProvider.credentialFromResult(result).accessToken;
          } catch (e) { 
            showToast('Please re-authenticate to access Drive.'); 
          }
        }

        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
        
        if (user.photoURL) {
          const avatar = document.getElementById('userAvatar');
          avatar.src = user.photoURL;
          avatar.style.display = 'block';
        }

        loadFiles();
      }
    });

    window.handleFiles = async (files) => {
      if (!accessToken) {
        showToast('Authentication expired. Please sign out and sign in again.');
        return;
      }

      for (const file of files) {
        showToast(`Uploading: ${file.name}`);

        try {
          const metadata = { name: file.name, mimeType: file.type || 'application/octet-stream' };
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', file);

          const res = await fetch(
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size,webViewLink,createdTime',
            { method: 'POST', headers: { Authorization: `Bearer ${accessToken}` }, body: form }
          );

          if (!res.ok) throw new Error('Upload failed');
          const driveFile = await res.json();

          await addDoc(collection(db, 'files'), {
            uid: currentUser.uid,
            driveFileId: driveFile.id,
            name: driveFile.name,
            mimeType: driveFile.mimeType,
            size: driveFile.size || file.size,
            webViewLink: driveFile.webViewLink,
            createdAt: serverTimestamp()
          });

        } catch (err) {
          showToast(`Error uploading ${file.name}`);
          console.error(err);
        }
      }
      
      showToast('Upload complete.');
      loadFiles();
    };

    window.loadFiles = async () => {
      if (!currentUser) return;
      
      document.getElementById('loadingSkeleton').classList.remove('hidden');
      document.getElementById('filesList').classList.add('hidden');
      
      try {
        const q = query(collection(db, 'files'), where('uid', '==', currentUser.uid));
        const snap = await getDocs(q);
        allFiles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        
        // Sort locally to avoid Firestore index error
        allFiles.sort((a, b) => {
          const timeA = a.createdAt?.toMillis() || 0;
          const timeB = b.createdAt?.toMillis() || 0;
          return timeB - timeA;
        });

        renderFiles(allFiles);
      } catch (err) {
        console.error("Firestore Error: ", err);
        document.getElementById('filesList').innerHTML = '<p style="color: red; grid-column: 1/-1;">Could not load files. Check Firestore Rules & Database creation.</p>';
        document.getElementById('filesList').classList.remove('hidden');
      } finally {
        document.getElementById('loadingSkeleton').classList.add('hidden');
      }
    };

    window.filterFiles = () => {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allFiles.filter(f => f.name.toLowerCase().includes(term));
      renderFiles(filtered);
    };

    window.renderFiles = (filesArray) => {
      const listEl = document.getElementById('filesList');
      listEl.classList.remove('hidden');
      
      if (filesArray.length === 0) {
        listEl.innerHTML = '<p style="grid-column: 1/-1; color: var(--text-muted); padding: 24px 0;">No files found.</p>';
        return;
      }

      listEl.innerHTML = filesArray.map(f => {
        let icon = 'draft'; let color = '#4285f4';
        if (f.mimeType?.includes('image')) { icon = 'image'; color = '#ea4335'; }
        if (f.mimeType?.includes('video')) { icon = 'movie'; color = '#fbbc04'; }
        if (f.mimeType?.includes('pdf')) { icon = 'picture_as_pdf'; color = '#d93025'; }
        if (f.mimeType?.includes('zip')) { icon = 'folder_zip'; color = '#a142f4'; }

        const sizeStr = f.size ? (f.size / 1024 / 1024).toFixed(2) + ' MB' : 'Unknown';

        return `
          <div class="file-card">
            <div class="file-card-header">
              <span class="material-symbols-outlined file-icon" style="color: ${color};">${icon}</span>
              <div>
                 <button class="btn btn-icon material-symbols-outlined" onclick="window.open('${f.webViewLink}', '_blank')" title="Open">open_in_new</button>
              </div>
            </div>
            <div class="file-name" title="${f.name}">${f.name}</div>
            <div class="file-meta">${sizeStr}</div>
            <div class="file-actions">
              <button class="btn btn-icon btn-danger-icon material-symbols-outlined" onclick="deleteFile('${f.id}', '${f.driveFileId}')" title="Delete">delete</button>
            </div>
          </div>
        `;
      }).join('');
    };

    window.deleteFile = async (firestoreId, driveFileId) => {
      if (!confirm('Delete this file permanently from your Drive?')) return;
      showToast('Deleting...');
      
      try {
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}`, {
          method: 'DELETE', headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (!res.ok && res.status !== 404) throw new Error('Drive deletion failed');

        await deleteDoc(doc(db, 'files', firestoreId));
        showToast('File deleted.');
        loadFiles();
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    };

    // Drag and Drop
    const dz = document.getElementById('dropZone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
  </script>
</body>
</html>
