<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MART Drive</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --bg-color: #f8f9fa;
      --surface: #ffffff;
      --border: #dadce0;
      --text-main: #202124;
      --text-muted: #5f6368;
      --danger: #d93025;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; }

    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

    /* Top Navigation Bar */
    .navbar {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { font-size: 22px; font-weight: 500; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .logo-icon { color: var(--primary); font-size: 24px; }

    .user-profile { display: flex; align-items: center; gap: 16px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); }
    .user-email { font-size: 14px; color: var(--text-main); font-weight: 500; }

    /* Buttons */
    .btn {
      padding: 8px 24px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary { background-color: var(--primary); color: white; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); }
    .btn-primary:hover { background-color: var(--primary-hover); box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3); }
    
    .btn-outline { background-color: transparent; color: var(--primary); border: 1px solid var(--border); }
    .btn-outline:hover { background-color: #f1f3f4; }
    
    .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--border); }
    .btn-danger:hover { background-color: #fce8e6; border-color: #fce8e6; }

    /* Layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; width: 100%; flex: 1; }

    /* Login Screen */
    .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 70vh; }
    .login-card { background: var(--surface); padding: 48px 40px; border-radius: 8px; border: 1px solid var(--border); text-align: center; max-width: 450px; width: 100%; }
    .login-card h1 { font-size: 28px; font-weight: 400; margin-bottom: 16px; }
    .login-card p { color: var(--text-muted); margin-bottom: 32px; font-size: 15px; line-height: 1.5; }

    /* Main App Layout */
    .app-layout { display: grid; grid-template-columns: 250px 1fr; gap: 24px; }
    
    /* Sidebar */
    .sidebar { background: var(--surface); padding: 16px 0; border-radius: 8px; border: 1px solid var(--border); height: fit-content; }
    .sidebar-item { padding: 12px 24px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-muted); border-radius: 0 24px 24px 0; margin-right: 12px; }
    .sidebar-item.active { background-color: #e8f0fe; color: var(--primary); }

    /* Main Content */
    .main-content { background: var(--surface); border-radius: 8px; border: 1px solid var(--border); padding: 24px; }
    .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header-actions h2 { font-size: 20px; font-weight: 500; color: var(--text-main); }

    /* Upload Area */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      margin-bottom: 24px;
      background-color: #fafafa;
      transition: all 0.2s;
    }
    .upload-area.dragover { border-color: var(--primary); background-color: #e8f0fe; }
    .upload-area p { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }

    /* File Grid */
    .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .file-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      transition: box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .file-card:hover { box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3); }
    .file-icon { font-size: 32px; margin-bottom: 12px; }
    .file-name { font-size: 14px; font-weight: 500; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
    .file-actions { display: flex; gap: 8px; margin-top: auto; }
    .file-actions .btn { flex: 1; padding: 6px; font-size: 12px; }

    /* Status Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #323232; color: white; padding: 12px 24px; border-radius: 4px;
      font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000;
    }
    .toast.show { opacity: 1; }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .app-layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <span class="logo-icon">📁</span> MART Drive
    </div>
    <div id="navActions" class="hidden">
      <div class="user-profile">
        <span id="userEmailDisplay" class="user-email"></span>
        <img id="userAvatar" class="user-avatar" src="" alt="User" style="display:none;">
        <button class="btn btn-outline" onclick="logout()">Sign out</button>
      </div>
    </div>
  </nav>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-wrapper container">
    <div class="login-card">
      <h1>Welcome to MART Drive</h1>
      <p>Securely store, organize, and access your files directly within your Google Drive.</p>
      <button class="btn btn-primary" style="width: 100%;" onclick="signIn()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- Main Application -->
  <div id="appScreen" class="container app-layout hidden">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-item active">📄 My Drive Files</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="header-actions">
        <h2>My Drive</h2>
      </div>

      <div class="upload-area" id="dropZone">
        <p>Drag and drop files here, or</p>
        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
          Browse Files
        </button>
        <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
      </div>

      <div id="filesList" class="files-grid">
        <!-- Files will be populated here -->
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Status message</div>

  <!-- Firebase Modules -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, addDoc, query, where, getDocs, deleteDoc, doc, serverTimestamp, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDUcT6hVqLHy3pYzwg1oktI7amTpF9Qj4c",
      authDomain: "mart-drive.firebaseapp.com",
      projectId: "mart-drive",
      storageBucket: "mart-drive.firebasestorage.app",
      messagingSenderId: "829348083361",
      appId: "1:829348083361:web:d6e91ccec70c2b9d53e2e0",
      measurementId: "G-J2ERB07TW0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let accessToken = null;

    // UI Helper: Toast Notification
    window.showToast = (msg) => {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    };

    // Sign In
    window.signIn = async () => {
      const provider = new GoogleAuthProvider();
      provider.addScope('https://www.googleapis.com/auth/drive.file');
      provider.setCustomParameters({ prompt: 'consent' });

      try {
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        accessToken = credential.accessToken;
        showToast('Successfully signed in.');
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    };

    // Sign Out
    window.logout = async () => {
      await signOut(auth);
      accessToken = null;
      currentUser = null;
      document.getElementById('appScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('navActions').classList.add('hidden');
    };

    // Auth State Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        
        // Handle token on page reload (popup token missing)
        if (!accessToken) {
          try {
            const provider = new GoogleAuthProvider();
            provider.addScope('https://www.googleapis.com/auth/drive.file');
            const result = await signInWithPopup(auth, provider);
            accessToken = GoogleAuthProvider.credentialFromResult(result).accessToken;
          } catch (e) { 
            showToast('Please click Sign in again to grant Drive access.'); 
          }
        }

        // Update UI
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
        document.getElementById('navActions').classList.remove('hidden');
        
        document.getElementById('userEmailDisplay').textContent = user.email;
        if (user.photoURL) {
          const avatar = document.getElementById('userAvatar');
          avatar.src = user.photoURL;
          avatar.style.display = 'block';
        }

        loadFiles();
      }
    });

    // File Upload Logic
    window.handleFiles = async (files) => {
      if (!accessToken) {
        showToast('Authentication token missing. Please sign out and sign in again.');
        return;
      }

      for (const file of files) {
        showToast(`Uploading ${file.name}...`);

        try {
          const metadata = {
            name: file.name,
            mimeType: file.type || 'application/octet-stream'
          };
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', file);

          const res = await fetch(
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size,webViewLink,createdTime',
            {
              method: 'POST',
              headers: { Authorization: `Bearer ${accessToken}` },
              body: form
            }
          );

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.error?.message || 'Upload failed');
          }
          
          const driveFile = await res.json();

          // Save metadata to Firestore
          await addDoc(collection(db, 'files'), {
            uid: currentUser.uid,
            driveFileId: driveFile.id,
            name: driveFile.name,
            mimeType: driveFile.mimeType,
            size: driveFile.size || file.size,
            webViewLink: driveFile.webViewLink,
            createdAt: serverTimestamp()
          });

        } catch (err) {
          console.error(err);
          showToast(`Failed to upload ${file.name}: ${err.message}`);
        }
      }
      
      showToast('Upload process completed.');
      loadFiles();
    };

    // Load Files from Firestore
    window.loadFiles = async () => {
      if (!currentUser) return;
      const listEl = document.getElementById('filesList');
      listEl.innerHTML = '<p style="grid-column: 1/-1; color: #5f6368;">Loading files...</p>';
      
      try {
        const q = query(
          collection(db, 'files'),
          where('uid', '==', currentUser.uid),
          orderBy('createdAt', 'desc')
        );
        const snap = await getDocs(q);
        const files = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        if (files.length === 0) {
          listEl.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #5f6368; padding: 40px 0;">No files uploaded yet.</p>';
          return;
        }

        listEl.innerHTML = files.map(f => {
          // Basic icon logic based on mime type
          let icon = '📄';
          if (f.mimeType && f.mimeType.includes('image')) icon = '🖼️';
          if (f.mimeType && f.mimeType.includes('video')) icon = '🎥';
          if (f.mimeType && f.mimeType.includes('pdf')) icon = '📕';
          if (f.mimeType && f.mimeType.includes('zip') || f.mimeType.includes('compressed')) icon = '🗜️';

          const sizeStr = f.size ? (f.size / 1024 / 1024).toFixed(2) + ' MB' : 'Unknown size';

          return `
            <div class="file-card">
              <div class="file-icon">${icon}</div>
              <div class="file-name" title="${f.name}">${f.name}</div>
              <div class="file-meta">${sizeStr}</div>
              <div class="file-actions">
                <button class="btn btn-outline" onclick="window.open('${f.webViewLink}', '_blank')">Open</button>
                <button class="btn btn-danger" onclick="deleteFile('${f.id}', '${f.driveFileId}')">Delete</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<p style="color: red;">Error loading files. Check console.</p>';
      }
    };

    // Delete File
    window.deleteFile = async (firestoreId, driveFileId) => {
      if (!confirm('Are you sure you want to permanently delete this file?')) return;
      
      try {
        // Delete from Drive
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (!res.ok && res.status !== 404) throw new Error('Failed to delete from Drive');

        // Delete from Firestore
        await deleteDoc(doc(db, 'files', firestoreId));
        
        showToast('File deleted.');
        loadFiles();
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    };

    // Drag and Drop Setup
    const dz = document.getElementById('dropZone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

  </script>
</body>
</html>
