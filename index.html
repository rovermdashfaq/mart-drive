<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#163A5F" />
<title>MART Drive - Enterprise</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root{
  --navy:#163A5F; --blue:#245B88; --bg:#F5F7FA; --surface:#FFFFFF;
  --text:#1F2937; --muted:#64748B; --border:#E2E8F0;
  --success:#15803D; --error:#B91C1C;
  --radius:10px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 12px 32px rgba(15,23,42,.16);
  --sidebar-w:260px; --header-h:64px;
  --transition:200ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text); font-family:Inter,sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
button{font:inherit; cursor:pointer; border:none; background:none;}
a{color:var(--blue); text-decoration:none;}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

/* Auth Screen */
#auth-screen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#163A5F 0%,#245B88 100%); padding:20px; z-index:100;}
.auth-card{background:var(--surface); border-radius:var(--radius-lg); padding:40px 32px; width:100%; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,.25); text-align:center;}
.auth-card img{width:80px; margin-bottom:20px;}
.auth-card h1{font-size:24px; color:var(--navy); margin-bottom:8px;}
.auth-card p{color:var(--muted); font-size:14px; margin-bottom:30px;}
.google-btn{display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:12px; background:#fff; border:1px solid var(--border); border-radius:8px; font-weight:600; font-size:14px; transition:all .2s; box-shadow:var(--shadow-sm); color:var(--text);}
.google-btn:hover{background:#f8f9fa; box-shadow:var(--shadow-md);}

/* Layout */
#app{display:none; min-height:100vh;}
#app.ready{display:block;}
.sidebar{position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; z-index:40;}
.sidebar-brand{display:flex; align-items:center; gap:12px; padding:20px; border-bottom:1px solid var(--border); cursor:pointer;}
.sidebar-brand img{width:36px; height:36px; border-radius:6px; object-fit:cover;}
.sidebar-brand h2{font-size:16px; color:var(--navy); font-weight:700; line-height:1.2;}
.sidebar-brand span{font-size:11px; color:var(--muted);}
.new-btn{margin:16px; padding:12px 20px; background:var(--navy); color:#fff; border-radius:30px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; transition:background .2s; box-shadow:var(--shadow-md);}
.new-btn:hover{background:var(--blue);}
.nav-list{list-style:none; padding:0 12px; flex:1; overflow-y:auto;}
.nav-section{padding:12px 16px 4px; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
.nav-item{display:flex; align-items:center; gap:14px; padding:10px 16px; border-radius:24px; color:var(--text); font-weight:500; cursor:pointer; transition:background .2s; margin-bottom:4px; font-size:13px;}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:#E8F0F7; color:var(--navy); font-weight:600;}
.nav-item .material-symbols-outlined{font-size:20px;}

/* Header */
.header{position:fixed; top:0; left:var(--sidebar-w); right:0; height:var(--header-h); background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; padding:0 24px; z-index:30;}
.search-box{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:24px; padding:0 16px; height:44px; width:100%; max-width:600px; transition:box-shadow .2s;}
.search-box:focus-within{background:var(--surface); box-shadow:var(--shadow-md); border:1px solid var(--border);}
.search-box input{border:none; background:transparent; flex:1; font-size:15px; outline:none;}
.user-btn{display:flex; align-items:center; gap:10px; padding:4px 12px 4px 4px; border:1px solid var(--border); border-radius:24px; background:var(--surface); transition:background .2s;}
.user-btn:hover{background:var(--bg);}
.user-avatar{width:32px; height:32px; border-radius:50%;}

/* Main */
.main{margin-left:var(--sidebar-w); padding-top:var(--header-h);}
.content{padding:24px; max-width:1400px; margin:0 auto;}
.page-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
.page-title{font-size:24px; font-weight:700; color:var(--navy);}
.toolbar{display:flex; gap:8px; align-items:center;}
.btn{padding:8px 16px; border-radius:8px; font-weight:500; border:1px solid var(--border); background:var(--surface); color:var(--text); transition:all .2s; display:flex; align-items:center; gap:6px;}
.btn:hover{border-color:var(--blue);}
.btn-primary{background:var(--navy); color:#fff; border-color:var(--navy);}
.btn-primary:hover{background:var(--blue);}

/* Dropzone & Progress */
.dropzone{border:2px dashed var(--border); border-radius:var(--radius-lg); padding:30px 20px; text-align:center; margin-bottom:24px; background:var(--surface); transition:all .2s; cursor:pointer;}
.dropzone:hover,.dropzone.dragover{border-color:var(--blue); background:#F0F6FB;}
.dropzone h3{color:var(--navy); font-size:16px; margin-bottom:8px;}
#upload-progress-container { display: none; margin-bottom: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.progress-bar-wrap { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress-bar-fill { height: 100%; background: var(--blue); width: 0%; transition: width 0.2s; }
.progress-text { font-size: 13px; display: flex; justify-content: space-between; margin-bottom: 4px; }

/* Files Grid */
.files-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px;}
.file-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; cursor:pointer; transition:all .2s; position:relative; display:flex; flex-direction:column;}
.file-card:hover{box-shadow:var(--shadow-md); border-color:#CBD5E1;}
.file-icon-wrap{width:48px; height:48px; border-radius:8px; background:#E8F0F7; color:var(--navy); display:flex; align-items:center; justify-content:center; margin-bottom:12px; font-size:24px;}
.file-icon-wrap img{width:100%; height:100%; object-fit:cover; border-radius:8px;}
.file-name{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:4px;}
.file-meta{font-size:12px; color:var(--muted); margin-bottom:12px;}
.file-actions{display:flex; gap:4px; margin-top:auto; opacity:0; transition:opacity .2s;}
.file-card:hover .file-actions{opacity:1;}
.icon-btn{padding:6px; border-radius:6px; color:var(--muted); display:flex; align-items:center; justify-content:center; transition:background .2s;}
.icon-btn:hover{background:var(--bg); color:var(--navy);}
.icon-btn .material-symbols-outlined{font-size:18px;}

/* Modals */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; opacity:0; transition:opacity .2s;}
.modal-backdrop.open{display:flex; opacity:1;}
.modal{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:500px; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,.3); transform:translateY(20px); transition:transform .2s;}
.modal-backdrop.open .modal{transform:translateY(0);}
.modal.wide{max-width:800px;}
.modal-head{padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{font-size:18px; color:var(--navy);}
.modal-body{padding:20px; overflow-y:auto;}
.modal-foot{padding:16px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}
.field label{display:block; font-size:13px; font-weight:500; margin-bottom:8px;}
.field input, .field select, .field textarea{width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; outline:none; font-size:14px; font-family:inherit;}
.field input:focus{border-color:var(--blue);}

/* Preview */
.preview-box{background:#0f172a; border-radius:10px; min-height:200px; max-height:500px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:20px;}
.preview-box img, .preview-box video{max-width:100%; max-height:480px; object-fit:contain;}

/* Toasts */
.toast-stack{position:fixed; bottom:24px; right:24px; z-index:2000; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--navy); color:#fff; padding:12px 20px; border-radius:8px; font-size:14px; box-shadow:var(--shadow-lg); animation:slideIn .3s ease-out;}
.toast.error{background:var(--error);}
@keyframes slideIn{from{transform:translateX(100%); opacity:0;} to{transform:translateX(0); opacity:1;}}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .header{left:0;}
  .main{margin-left:0;}
  .files-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .file-actions{opacity:1;}
}
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-card">
    <img src="https://i.ibb.co/TDDQSCjK/Picsart-26-10-26-00-05-00-213.png" alt="MART Drive">
    <h1>MART Drive</h1>
    <p>Enterprise Workspace & Cloud Storage</p>
    <button class="google-btn" onclick="signIn()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand" onclick="openOrgModal()">
      <img id="org-logo-display" src="https://i.ibb.co/TDDQSCjK/Picsart-26-10-26-00-05-00-213.png" alt="Logo">
      <div>
        <h2 id="org-name-display">MART Drive</h2>
        <span>Click to switch Workspace</span>
      </div>
    </div>
    <button class="new-btn" onclick="document.getElementById('file-input').click()">
      <span class="material-symbols-outlined">add</span> Upload File
    </button>
    <ul class="nav-list">
      <li class="nav-section">Main</li>
      <li><div class="nav-item active" onclick="setView('drive')"><span class="material-symbols-outlined">folder</span> My Files</div></li>
      <li><div class="nav-item" onclick="setView('recent')"><span class="material-symbols-outlined">schedule</span> Recent</div></li>
      
      <li class="nav-section">Organizations</li>
      <div id="org-list-container"></div>
    </ul>
  </aside>

  <header class="header">
    <div class="search-box">
      <span class="material-symbols-outlined" style="color:var(--muted)">search</span>
      <input type="search" id="search-input" placeholder="Search files..." oninput="handleSearch(this.value)">
    </div>
    <div style="flex:1"></div>
    <button class="user-btn" onclick="logout()">
      <img id="user-avatar" class="user-avatar" src="" style="display:none">
      <span style="font-weight:500; font-size:13px">Sign Out</span>
    </button>
  </header>

  <main class="main">
    <div class="content">
      <div class="page-head">
        <div>
          <h1 class="page-title" id="page-title">My Files</h1>
          <div style="font-size:13px; color:var(--muted)" id="page-meta">0 items</div>
        </div>
        <div class="toolbar">
          <button class="btn btn-primary" onclick="openNewFolderModal()">
            <span class="material-symbols-outlined">create_new_folder</span> New Folder
          </button>
        </div>
      </div>

      <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
        <h3>Drag & Drop or Click to Upload</h3>
        <p style="color:var(--muted); font-size:13px;">Files will be stored in Google Drive and linked to <span id="upload-context">My Files</span></p>
        <input type="file" id="file-input" hidden multiple onchange="handleFiles(this.files)">
      </div>

      <!-- Upload Progress Bar -->
      <div id="upload-progress-container">
        <div class="progress-text">
          <span id="progress-filename">Uploading...</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill"></div></div>
      </div>

      <!-- Breadcrumbs for folders -->
      <div id="breadcrumbs" style="margin-bottom:16px; font-size:14px; display:flex; gap:8px; align-items:center;"></div>

      <div class="files-grid" id="files-grid"></div>
    </div>
  </main>
</div>

<!-- Universal Modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">Modal</h3>
      <button class="icon-btn" onclick="closeModal()"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, query, where, serverTimestamp, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDUcT6hVqLHy3pYzwg1oktI7amTpF9Qj4c",
  authDomain: "mart-drive.firebaseapp.com",
  projectId: "mart-drive",
  storageBucket: "mart-drive.firebasestorage.app",
  messagingSenderId: "829348083361",
  appId: "1:829348083361:web:d6e91ccec70c2b9d53e2e0",
  measurementId: "G-J2ERB07TW0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let accessToken = null;

// App State
let allFiles = [];
let allFolders = [];
let organizations = [];
let currentOrgId = null; // null = personal drive
let currentFolderId = null;
let currentView = 'drive';
let searchTerm = '';
let unsubFiles = null;
let unsubFolders = null;
let unsubOrgs = null;
let hasTriedSilentLogin = false;

// ----------------------------------------------------
// AUTHENTICATION
// ----------------------------------------------------
window.signIn = async () => {
  const provider = new GoogleAuthProvider();
  provider.addScope('https://www.googleapis.com/auth/drive.file');
  provider.setCustomParameters({ prompt: 'consent' });
  try {
    const result = await signInWithPopup(auth, provider);
    accessToken = GoogleAuthProvider.credentialFromResult(result).accessToken;
  } catch (err) { toast(err.message, 'error'); }
};

window.logout = async () => {
  await signOut(auth);
  window.location.reload();
};

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').classList.add('ready');
    
    if (user.photoURL) {
      const av = document.getElementById('user-avatar');
      av.src = user.photoURL;
      av.style.display = 'block';
    }

    if (!accessToken && !hasTriedSilentLogin) {
      hasTriedSilentLogin = true;
      try {
        const provider = new GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/drive.file');
        provider.setCustomParameters({ prompt: '' }); 
        const result = await signInWithPopup(auth, provider);
        accessToken = GoogleAuthProvider.credentialFromResult(result).accessToken;
      } catch (err) {
        console.warn("Silent login failed.");
      }
    }

    setupListeners();
  } else {
    currentUser = null;
    accessToken = null;
    hasTriedSilentLogin = false;
    document.getElementById('app').classList.remove('ready');
    document.getElementById('auth-screen').style.display = 'flex';
    if (unsubFiles) unsubFiles();
    if (unsubFolders) unsubFolders();
    if (unsubOrgs) unsubOrgs();
  }
});

// ----------------------------------------------------
// DATA LISTENERS
// ----------------------------------------------------
function setupListeners() {
  const uid = currentUser.uid;
  const email = currentUser.email;

  if (unsubOrgs) unsubOrgs();
  const qOrgs1 = query(collection(db, 'organizations'), where('owner', '==', uid));
  
  unsubOrgs = onSnapshot(qOrgs1, (snap1) => {
    const orgs1 = snap1.docs.map(d => ({ id: d.id, ...d.data() }));
    organizations = orgs1;
    renderOrgSidebar();
    loadFilesAndFolders(); // Reload files when org list changes
  });

  loadFilesAndFolders();
}

function loadFilesAndFolders() {
  const uid = currentUser.uid;
  if (unsubFolders) unsubFolders();
  if (unsubFiles) unsubFiles();

  let fQuery, fiQuery;
  
  // FIXED: Firestore null query issue avoided by using "== false" or checking data later
  // Here we will fetch all user's files and filter locally to prevent Index errors.
  fQuery = query(collection(db, 'folders'), where('uid', '==', uid));
  fiQuery = query(collection(db, 'files'), where('uid', '==', uid));

  unsubFolders = onSnapshot(fQuery, (snap) => {
    allFolders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  unsubFiles = onSnapshot(fiQuery, (snap) => {
    allFiles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

// ----------------------------------------------------
// ORGANIZATION LOGIC
// ----------------------------------------------------
function switchOrg(orgId) {
  currentOrgId = orgId;
  currentFolderId = null;
  
  if (orgId) {
    const org = organizations.find(o => o.id === orgId);
    document.getElementById('org-name-display').textContent = org.name;
    document.getElementById('org-logo-display').src = org.logoUrl || "https://i.ibb.co/TDDQSCjK/Picsart-26-10-26-00-05-00-213.png";
  } else {
    document.getElementById('org-name-display').textContent = "Personal Drive";
    document.getElementById('org-logo-display').src = "https://i.ibb.co/TDDQSCjK/Picsart-26-10-26-00-05-00-213.png";
  }
  
  renderOrgSidebar();
  setView('drive');
}

function renderOrgSidebar() {
  const container = document.getElementById('org-list-container');
  container.innerHTML = '';
  
  const personalDiv = document.createElement('div');
  personalDiv.className = 'nav-item' + (!currentOrgId ? ' active' : '');
  personalDiv.innerHTML = `<span class="material-symbols-outlined">person</span> Personal Drive`;
  personalDiv.onclick = () => switchOrg(null);
  container.appendChild(personalDiv);

  organizations.forEach(org => {
    const div = document.createElement('div');
    div.className = 'nav-item' + (currentOrgId === org.id ? ' active' : '');
    div.innerHTML = `<img src="${org.logoUrl || 'https://i.ibb.co/TDDQSCjK/Picsart-26-10-26-00-05-00-213.png'}" style="width:20px;height:20px;border-radius:4px;"> ${org.name}`;
    div.onclick = () => switchOrg(org.id);
    container.appendChild(div);
  });

  const btnDiv = document.createElement('div');
  btnDiv.className = 'nav-item';
  btnDiv.style.color = 'var(--blue)';
  btnDiv.innerHTML = `<span class="material-symbols-outlined">add_circle</span> Create Organization`;
  btnDiv.onclick = openOrgModal;
  container.appendChild(btnDiv);
}

window.openOrgModal = () => {
  const body = `
    <div class="field" style="margin-bottom:12px">
      <label>Organization Name</label>
      <input type="text" id="org-name-input" placeholder="e.g. Bangladesh Scouts Rover Region">
    </div>
    <div class="field">
      <label>Logo Image URL (Optional)</label>
      <input type="text" id="org-logo-input" placeholder="https://example.com/logo.png">
    </div>
  `;
  document.getElementById('modal-title').textContent = 'Create Organization';
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-foot').innerHTML = `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="createOrg()">Create</button>
  `;
  document.getElementById('modal-box').classList.remove('wide');
  document.getElementById('modal-backdrop').classList.add('open');
};

window.createOrg = async () => {
  const name = document.getElementById('org-name-input').value.trim();
  const logoUrl = document.getElementById('org-logo-input').value.trim();
  if (!name) return toast('Name required', 'error');
  
  try {
    await addDoc(collection(db, 'organizations'), {
      name,
      logoUrl: logoUrl || null,
      owner: currentUser.uid,
      members: [currentUser.email.toLowerCase()],
      createdAt: serverTimestamp()
    });
    toast('Organization created!', 'success');
    closeModal();
  } catch (err) { toast(err.message, 'error'); }
};

// ----------------------------------------------------
// FOLDERS & FILES
// ----------------------------------------------------
window.openNewFolderModal = () => {
  const body = `<div class="field"><label>Folder Name</label><input type="text" id="folder-name" placeholder="Untitled Folder"></div>`;
  document.getElementById('modal-title').textContent = 'Create Folder';
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-foot').innerHTML = `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="createFolder()">Create</button>
  `;
  document.getElementById('modal-backdrop').classList.add('open');
};

window.createFolder = async () => {
  const name = document.getElementById('folder-name').value.trim();
  if (!name) return;
  
  const data = {
    name,
    parentId: currentFolderId,
    orgId: currentOrgId || null, // null for personal
    uid: currentUser.uid,
    createdAt: serverTimestamp(),
  };

  try {
    await addDoc(collection(db, 'folders'), data);
    toast('Folder created', 'success');
    closeModal();
  } catch (err) { toast(err.message, 'error'); }
};

window.openFolder = (folderId) => {
  currentFolderId = folderId;
  render();
};

function renderBreadcrumbs() {
  const bc = document.getElementById('breadcrumbs');
  bc.innerHTML = '';
  
  const root = document.createElement('span');
  root.style.cursor = 'pointer';
  root.style.color = 'var(--blue)';
  root.textContent = currentOrgId ? 'Root' : 'My Drive';
  root.onclick = () => { currentFolderId = null; render(); };
  bc.appendChild(root);

  if (currentFolderId) {
    let path = [];
    let cur = allFolders.find(f => f.id === currentFolderId);
    while (cur) {
      path.unshift(cur);
      cur = allFolders.find(f => f.id === cur.parentId);
    }
    path.forEach(f => {
      const sep = document.createElement('span');
      sep.textContent = '/';
      sep.style.color = 'var(--muted)';
      bc.appendChild(sep);
      
      const el = document.createElement('span');
      el.textContent = f.name;
      el.style.cursor = 'pointer';
      el.style.color = 'var(--blue)';
      el.onclick = () => { currentFolderId = f.id; render(); };
      bc.appendChild(el);
    });
  }
}

// ----------------------------------------------------
// RENDER LOGIC
// ----------------------------------------------------
window.setView = (view) => {
  currentView = view;
  currentFolderId = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  render();
};

window.handleSearch = (val) => {
  searchTerm = val.toLowerCase();
  render();
};

function render() {
  renderBreadcrumbs();
  
  let displayItems = [];
  
  // Filter files by currentOrgId and currentFolderId locally
  let filteredFiles = allFiles.filter(f => (f.orgId || null) === currentOrgId);
  let filteredFolders = allFolders.filter(f => (f.orgId || null) === currentOrgId);

  if (currentView === 'drive') {
    filteredFolders = filteredFolders.filter(f => (f.parentId || null) === currentFolderId);
    filteredFiles = filteredFiles.filter(f => (f.folderId || null) === currentFolderId);
    
    filteredFolders.forEach(f => displayItems.push({ type: 'folder', ...f }));
    filteredFiles.forEach(f => displayItems.push({ type: 'file', ...f }));
  } else if (currentView === 'recent') {
    const sorted = [...filteredFiles].sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));
    sorted.slice(0, 50).forEach(f => displayItems.push({ type: 'file', ...f }));
  }

  if (searchTerm) {
    displayItems = displayItems.filter(item => item.name.toLowerCase().includes(searchTerm));
  }

  document.getElementById('page-meta').textContent = `${displayItems.length} items`;
  document.getElementById('page-title').textContent = currentView === 'drive' ? 'My Files' : 'Recent';
  document.getElementById('dropzone').style.display = currentView === 'drive' ? 'block' : 'none';
  document.getElementById('upload-context').textContent = currentOrgId ? 'Organization Drive' : 'My Files';

  const grid = document.getElementById('files-grid');
  grid.innerHTML = '';

  if (displayItems.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted)">No files or folders here.</div>';
    return;
  }

  displayItems.forEach(item => {
    const card = document.createElement('div');
    card.className = 'file-card';
    
    if (item.type === 'folder') {
      card.innerHTML = `
        <div class="file-icon-wrap"><span class="material-symbols-outlined" style="color:#F59E0B">folder</span></div>
        <div class="file-name">${item.name}</div>
        <div class="file-meta">Folder</div>
      `;
      card.onclick = () => openFolder(item.id);
    } else {
      const isImg = item.mimeType?.includes('image');
      let icon = `<span class="material-symbols-outlined">description</span>`;
      if (isImg) icon = `<img src="https://drive.google.com/thumbnail?id=${item.driveFileId}&sz=w200&authuser=0">`;
      else if (item.mimeType?.includes('video')) icon = `<span class="material-symbols-outlined">movie</span>`;
      else if (item.mimeType?.includes('pdf')) icon = `<span class="material-symbols-outlined">picture_as_pdf</span>`;

      card.innerHTML = `
        <div class="file-icon-wrap">${icon}</div>
        <div class="file-name" title="${item.name}">${item.name}</div>
        <div class="file-meta">${fmtSize(item.size)}</div>
        <div class="file-actions">
          <button class="icon-btn" onclick="event.stopPropagation(); previewFile('${item.driveFileId}', '${item.mimeType}', '${item.name}')"><span class="material-symbols-outlined">visibility</span></button>
          <button class="icon-btn" onclick="event.stopPropagation(); deleteFile('${item.id}', '${item.driveFileId}')"><span class="material-symbols-outlined">delete</span></button>
        </div>
      `;
      card.onclick = () => previewFile(item.driveFileId, item.mimeType, item.name);
    }
    grid.appendChild(card);
  });
}

// ----------------------------------------------------
// UPLOAD WITH PROGRESS BAR
// ----------------------------------------------------
window.handleFiles = async (files) => {
  if (!accessToken) return toast('Please sign in again to upload.', 'error');
  
  const progressContainer = document.getElementById('upload-progress-container');
  const progressFill = document.getElementById('progress-fill');
  const progressPercent = document.getElementById('progress-percent');
  const progressFilename = document.getElementById('progress-filename');
  
  progressContainer.style.display = 'block';

  for (const file of files) {
    progressFilename.textContent = `Uploading: ${file.name}`;
    progressFill.style.width = '0%';
    progressPercent.textContent = '0%';

    try {
      const metadata = { name: file.name, mimeType: file.type || 'application/octet-stream' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', file);
      
      // Using XHR to get upload progress
      const driveFile = await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size');
        xhr.setRequestHeader('Authorization', `Bearer ${accessToken}`);
        
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            progressFill.style.width = pct + '%';
            progressPercent.textContent = pct + '%';
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(JSON.parse(xhr.responseText));
          } else {
            reject(new Error('Upload failed with status ' + xhr.status));
          }
        };
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.send(form);
      });

      // Make public for preview
      await fetch(`https://www.googleapis.com/drive/v3/files/${driveFile.id}/permissions`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: 'reader', type: 'anyone' })
      }).catch(() => {});

      const fileData = {
        driveFileId: driveFile.id,
        name: driveFile.name,
        mimeType: driveFile.mimeType,
        size: driveFile.size || file.size,
        folderId: currentFolderId,
        orgId: currentOrgId || null,
        uid: currentUser.uid,
        createdAt: serverTimestamp()
      };

      await addDoc(collection(db, 'files'), fileData);
    } catch (err) {
      toast(`Error uploading ${file.name}: ` + err.message, 'error');
    }
  }
  
  // Reset Progress Bar
  setTimeout(() => {
    progressContainer.style.display = 'none';
    progressFill.style.width = '0%';
    progressPercent.textContent = '0%';
  }, 1000);
  
  toast('All uploads complete!', 'success');
};

// ----------------------------------------------------
// PREVIEW
// ----------------------------------------------------
window.previewFile = (driveId, mimeType, name) => {
  const body = document.getElementById('modal-body');
  document.getElementById('modal-title').textContent = name || 'File Preview';
  
  let html = `<div class="preview-box">Preview not available for this file type.</div>`;
  
  if (mimeType?.includes('image')) {
    // Using Google Drive thumbnail API (Works if file is public or user has access)
    html = `<div class="preview-box"><img src="https://drive.google.com/thumbnail?id=${driveId}&sz=w1000&authuser=0"></div>`;
  } else if (mimeType?.includes('video') || mimeType?.includes('pdf')) {
    // Embed preview for video and pdf
    html = `<div class="preview-box" style="background:#fff"><iframe src="https://drive.google.com/file/d/${driveId}/preview" width="100%" height="500px" allow="autoplay"></iframe></div>`;
  }
  
  body.innerHTML = html;
  document.getElementById('modal-foot').innerHTML = `
    <button class="btn" onclick="window.open('https://drive.google.com/file/d/${driveId}/view', '_blank')">Open in Drive</button>
    <button class="btn btn-primary" onclick="closeModal()">Close</button>
  `;
  document.getElementById('modal-box').classList.add('wide');
  document.getElementById('modal-backdrop').classList.add('open');
};

window.deleteFile = async (firestoreId, driveId) => {
  if (!confirm('Delete permanently?')) return;
  try {
    await fetch(`https://www.googleapis.com/drive/v3/files/${driveId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${accessToken}` } });
    await deleteDoc(doc(db, 'files', firestoreId));
    toast('Deleted', 'success');
  } catch (err) { toast('Delete failed', 'error'); }
};

// Utils
window.closeModal = () => document.getElementById('modal-backdrop').classList.remove('open');
function toast(msg, type="") {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  document.getElementById('toast-stack').appendChild(t);
  setTimeout(() => { t.remove(); }, 3000);
}
function fmtSize(b) {
  if (!b) return '0 B'; if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

// Dropzone init
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', (e) => {
  e.preventDefault(); dz.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});
</script>
